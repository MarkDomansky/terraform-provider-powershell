version: 2

# Pinned rather than inferred from the repo name: binaries and archives must
# carry the canonical provider name terraform expects, whatever the repo is
# called. (This mattered when the tree also lived in a `-alpha` repo; keep it
# pinned so a future rename cannot leak into artifact names.)
project_name: terraform-provider-powershell

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags:
      - -trimpath
    ldflags:
      - '-s -w -X main.version={{.Version}}'
    goos:
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    binary: '{{ .ProjectName }}_v{{ .Version }}'

archives:
  - format: zip
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    files:
      - src: 'dist-pshost/{{ .Os }}-{{ .Arch }}/pshost{{ if eq .Os "windows" }}.exe{{ end }}'
        dst: .
        strip_parent: true

# The Terraform Registry requires the manifest (with its protocol declaration)
# published alongside the archives under this exact name.
release:
  draft: false
  extra_files:
    - glob: 'terraform-registry-manifest.json'
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'

checksum:
  # The manifest must have a line in SHA256SUMS, not just be uploaded next to
  # it: the Terraform Registry refuses a version with "missing SHA256 checksum
  # for ..._manifest.json". `release.extra_files` above only covers the upload,
  # and this pipeline skips GoReleaser's publish step anyway, so without this
  # block the manifest is never checksummed. The name_template must match the
  # one used for the upload, or the checksum line names a file nobody ships.
  extra_files:
    - glob: 'terraform-registry-manifest.json'
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'
  name_template: '{{ .ProjectName }}_{{ .Version }}_SHA256SUMS'
  algorithm: sha256

signs:
  - artifacts: checksum
    args:
      - "--batch"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
