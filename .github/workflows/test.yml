name: Tests
# Skipped for docs- and examples-only changes: nothing in them affects the
# build, the linters or the suite. tests/** is deliberately NOT ignored - a
# change to the Pester suite is exactly what this workflow exists to validate.
on:
  push:
    branches: [main, beta]
    paths-ignore:
      - 'docs/**'
      - 'examples/**'
      - '**/*.md'
      - 'LICENSE'
      - '.github/workflows/wiki-sync.yml'
      - '.github/scripts/Sync-DocsToWiki.ps1'
  pull_request:
    # `beta` is the day-to-day target: work lands as squash-merged PRs into it.
    # `main` only ever receives the beta -> main GA merge.
    branches: [main, beta]
    # Keep in sync with the push filter above (Actions does not support YAML
    # anchors, so this has to be repeated).
    paths-ignore:
      - 'docs/**'
      - 'examples/**'
      - '**/*.md'
      - 'LICENSE'
      - '.github/workflows/wiki-sync.yml'
      - '.github/scripts/Sync-DocsToWiki.ps1'

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build -v ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v8

  build-pshost:
    name: Build PSHost Sidecar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Build PSHost for linux-x64
        # Publish settings (single-file, self-extract, no-trim) live in the csproj.
        run: |
          dotnet publish csharp/PSHost/PSHost.csproj \
            -r linux-x64 \
            --self-contained \
            -c Release \
            -o dist/
      - name: Upload PSHost binary
        uses: actions/upload-artifact@v4
        with:
          name: pshost-linux-x64
          path: dist/pshost
          # Handoff to go-test in this same run only - nothing reads it
          # afterwards, so do not let a ~45MB binary sit for the default
          # 90 days on every push and PR.
          retention-days: 1

  csharp-test:
    name: C# Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Run C# tests
        run: dotnet test csharp/PSHost.Tests/ -v normal

  go-test:
    name: Go Unit Tests
    needs: [build, build-pshost]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Download PSHost binary
        uses: actions/download-artifact@v4
        with:
          name: pshost-linux-x64
      - name: Make PSHost executable and add to PATH
        run: |
          chmod +x pshost
          sudo mv pshost /usr/local/bin/
      - name: Run unit tests
        run: go test ./scriptprovider/ -v -timeout 120s

  pester-test:
    name: Pester E2E Tests (real terraform)
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            sidecar: dist/pshost.exe
          - os: ubuntu-latest
            rid: linux-x64
            sidecar: dist/pshost
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Build PSHost sidecar (${{ matrix.rid }}, self-contained)
        run: dotnet publish csharp/PSHost/PSHost.csproj -r ${{ matrix.rid }} --self-contained -c Release -o dist
      - name: Install Pester 5
        shell: pwsh
        run: Install-Module Pester -Force -SkipPublisherCheck -MinimumVersion 5.0
      # The Pester suite builds the provider from source (go build) and drives
      # real terraform against it via dev_overrides, so only go/dotnet/terraform
      # need to be present. PSHOST_PATH points the provider at the sidecar built
      # above; the suite stages it next to the freshly built provider binary.
      # pwsh is preinstalled on both the Windows and Ubuntu runners, so the same
      # suite runs unchanged on each platform.
      - name: Run Pester suite
        shell: pwsh
        env:
          PSHOST_PATH: ${{ github.workspace }}/${{ matrix.sidecar }}
        run: |
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = 'tests/pester'
          $cfg.Run.Exit = $true
          $cfg.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $cfg
